# Publishes a version when its tag is pushed (`npm version` makes the tag;
# see "Versión" in CLAUDE.md). Builds for Windows, macOS (Apple silicon and
# Intel) and Linux, signs each build for the updater, and publishes them in
# the public releases repository — where "Check for updates" looks.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — the
#     updater's signing key (its public half is in tauri.conf.json).
#   RELEASES_TOKEN — fine-grained token with Contents: read and write on the
#     releases repository only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_REPO: termo-releases

jobs:
  # A draft release first, so the builds upload side by side into it and
  # nobody sees the version until every file is there.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - name: Notes from changelog.json
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          result-encoding: string
          script: |
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: process.env.RELEASES_REPO,
              tag_name: tag,
              name: `Termo ${tag.replace(/^v/, "")}`,
              body: fs.readFileSync("notes.md", "utf8"),
              draft: true,
            });
            return String(data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # A branch, not a release: pinned to the commit it pointed at. Dependabot
      # doesn't follow branches, so this one is bumped by hand now and then.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ env.RELEASES_REPO }}
          releaseId: ${{ needs.create-release.outputs.id }}
          # Written once, by the publish job (see scripts/updater-manifest.mjs).
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: latest.json, then publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ github.repository_owner }}/${{ env.RELEASES_REPO }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: node scripts/publish-release.mjs
