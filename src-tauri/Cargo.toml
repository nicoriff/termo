[package]
name = "termo"
version = "0.8.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
base64 = "0.22"
ureq = { version = "2", features = ["tls"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# Native open/save dialogs (importing and exporting agents).
tauri-plugin-dialog = "2"
# Agents' secrets (API tokens for their integrations) live in the system
# keychain: Credential Manager, Keychain, the kernel keyring.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Agents' schedules ("every day at 09:00", in local time) and folder
# watching ("run when something changes here").
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
# The agents' local webhook (127.0.0.1 only).
tiny_http = "0.12"
# Updates from "Check for updates": signed builds from the GitHub releases
# (see plugins.updater in tauri.conf.json), and the restart after one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # Keeping the computer awake (keep_awake.rs).
    "Win32_System_Power",
] }

[target.'cfg(unix)'.dependencies]
# Already resolved transitively via portable-pty, so declaring it directly
# for the Modo IA foreground-process lookup (pty/foreground.rs) adds no new
# crate to the dependency graph.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the graph through tauri/wry (same version), for reading the
# user's titlebar button layout (window_commands::decoration_layout).
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"


# Full debuginfo made target/debug grow past 15 GB; file:line in backtraces is enough.
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
