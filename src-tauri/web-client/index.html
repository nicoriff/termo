<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Termo</title>
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button id="menu" class="menu-button" aria-expanded="false" data-label="allConsoles">
          <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <nav id="tab-list" class="tab-list"></nav>
        <button id="new" class="new-button" data-label="newConsoleHint" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" /></svg>
        </button>
        <span id="link" class="link-dot" role="status"></span>
      </header>

      <div class="stage">
        <main id="console" class="console" hidden>
          <div id="terminal-frame" class="terminal-frame"><div id="terminal"></div></div>
        </main>

        <div id="backdrop" class="backdrop" hidden></div>
        <aside id="home" class="home">
          <div class="home-head">
            <img class="app-icon" src="/icon.png" alt="" />
            <div class="home-title">
              <span class="app-name">Termo</span>
              <span id="host" class="host"></span>
            </div>
            <button id="refresh" class="round-button" data-label="refresh">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" /></svg>
            </button>
          </div>
          <p id="status" class="status"></p>
          <!-- Consoles or agents (see agents.js). -->
          <div id="parts" class="parts" role="tablist" hidden>
            <button id="show-consoles" class="part" role="tab" data-text="consolesPart"></button>
            <button id="show-agents" class="part" role="tab" data-text="agentsPart"></button>
          </div>
          <div id="consoles-part">
          <h2 id="home-heading" class="home-heading" data-text="consoles" hidden></h2>
          <ul id="sessions" class="session-list"></ul>
          <!-- A new console, opened by Termo on that computer as a tab of
               its own (full access only). -->
          <section id="opener" class="opener" hidden>
            <h2 class="home-heading" data-text="newConsole"></h2>
            <div id="open-folder-row" class="open-folder">
              <span class="open-folder-label" data-text="folder"></span>
              <button id="open-folder" class="folder-pick">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v8h13v-7h-6l-1.5-1.5h-5.5z" /></svg>
                <span class="folder-pick-text">
                  <span id="open-folder-name" class="folder-pick-name"></span>
                  <span id="open-folder-path" class="folder-pick-path"></span>
                </span>
                <svg class="chevron" viewBox="0 0 6 10" aria-hidden="true"><path d="M1 1l4 4-4 4" /></svg>
              </button>
            </div>
            <div id="open-choices" class="open-choices"></div>
            <p id="open-status" class="status open-status"></p>
          </section>
          </div>
          <!-- The agents on that computer: what they wait on, and each one. -->
          <div id="agents-part" class="agents-part" hidden>
            <p id="agents-note" class="status"></p>
            <div id="agent-questions" class="agent-questions"></div>
            <div class="agents-head">
              <h2 class="home-heading" data-text="agentsHeading"></h2>
              <button id="new-agent" class="pill compact" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" /></svg>
                <span data-text="newAgent"></span>
              </button>
            </div>
            <ul id="agent-list" class="session-list"></ul>
            <p id="agents-edit-off" class="hint" data-text="editOffHint" hidden></p>
          </div>
        </aside>

        <!-- An agent, one of its runs, or the form to create or change one. -->
        <section id="agent-panel" class="agent-panel" hidden>
          <header class="folders-head">
            <button id="agent-back" class="round-button" data-label="back">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" /></svg>
            </button>
            <h2 id="agent-panel-title" class="folders-title panel-title"></h2>
            <span id="agent-panel-actions" class="panel-actions"></span>
          </header>
          <div id="agent-panel-body" class="panel-body"></div>
          <footer id="agent-panel-foot" class="folders-actions" hidden></footer>
        </section>

        <!-- Where a new console opens: the desktop's folder browser, by touch. -->
        <section id="folders" class="folders" hidden>
          <header class="folders-head">
            <button id="folders-back" class="round-button" data-label="back">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" /></svg>
            </button>
            <h2 class="folders-title" data-text="pickFolder"></h2>
          </header>
          <nav id="crumbs" class="crumbs"></nav>
          <div id="folder-list" class="folder-list"></div>
          <p id="folders-error" class="status folders-error"></p>
          <footer class="folders-actions">
            <button id="new-folder" class="pill">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v8h13v-7h-6l-1.5-1.5h-5.5z" /><path d="M8 7v4M6 9h4" /></svg>
              <span data-text="newFolder"></span>
            </button>
            <button id="use-folder" class="pill primary"></button>
          </footer>
        </section>
      </div>

      <nav id="keys" class="keys" hidden>
        <div class="key-group">
          <button data-key="esc">Esc</button>
          <button data-key="tab">Tab</button>
        </div>
        <div class="key-group">
          <button data-key="ctrl" id="ctrl" class="toggle">Ctrl</button>
          <button data-key="alt" id="alt" class="toggle">Alt</button>
        </div>
        <div class="key-group">
          <button data-key="left" data-label="left" class="arrow">←</button>
          <button data-key="up" data-label="up" class="arrow">↑</button>
          <button data-key="down" data-label="down" class="arrow">↓</button>
          <button data-key="right" data-label="right" class="arrow">→</button>
        </div>
        <div class="key-group">
          <button data-key="enter" data-label="enter">⏎</button>
          <button data-key="ctrlc" class="danger">^C</button>
        </div>
        <div class="key-group">
          <button data-key="pgup">PgUp</button>
          <button data-key="pgdn">PgDn</button>
          <button data-key="home">Home</button>
          <button data-key="end">End</button>
        </div>
        <div class="key-group">
          <button data-key="send" data-text="send"></button>
        </div>
      </nav>

      <footer class="statusbar">
        <!-- What the desktop's status bar says of the console: scrolls
             sideways when it doesn't fit; the controls stay put. -->
        <div id="info" class="status-info">
          <span id="details" class="status-details"></span>
        </div>
        <span id="access" class="status-item"></span>
        <span class="status-spacer"></span>
        <span id="size" class="status-item size" hidden></span>
        <button id="fit" class="status-button" data-text="fit" data-label="fitHint" hidden></button>
        <button id="smaller" class="status-button" data-label="smaller" hidden>A−</button>
        <button id="bigger" class="status-button" data-label="bigger" hidden>A+</button>
      </footer>
    </div>
    <script src="/xterm.js"></script>
    <script src="/addon-fit.js"></script>
    <script src="/app.js"></script>
    <script src="/agents.js"></script>
  </body>
</html>
